name: Check blog redesign
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Hugo
        run: |
          curl -fsSL -o /tmp/hugo.deb https://github.com/gohugoio/hugo/releases/download/v0.152.2/hugo_extended_0.152.2_linux-amd64.deb
          sudo dpkg -i /tmp/hugo.deb
      - name: Build and check writing workflow
        run: |
          hugo --minify
          node --test scripts/studio.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: blog-preview
          path: public
          retention-days: 7
