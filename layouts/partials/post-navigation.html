{{ $current := .RelPermalink }}
<nav class="post-navigation" aria-label="Browse posts">
    {{ range slice (dict "title" "Posts" "url" "/posts/") (dict "title" "Archive" "url" "/archive/") (dict "title" "Tags" "url" "/tags/") }}
    <a href="{{ .url | relURL }}" {{ if eq $current (.url | relURL) }}aria-current="page"{{ end }}>{{ .title }}</a>
    {{ end }}
</nav>
