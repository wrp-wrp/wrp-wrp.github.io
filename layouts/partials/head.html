<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · rprp{{ end }}</title>
<meta name="description" content="{{ or .Description .Params.summary site.Params.description | plainify | truncate 160 }}">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="icon" type="image/svg+xml" href="{{ "images/mark.svg" | relURL }}">
{{ $style := resources.Get "css/journal.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">
<link rel="alternate" type="application/rss+xml" title="rprp 的博客" href="{{ "posts/index.xml" | relURL }}">
{{ if eq .Layout "studio" }}<meta name="robots" content="noindex,nofollow">{{ end }}
