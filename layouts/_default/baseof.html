<!doctype html>
<html lang="zh-CN">
<head>{{ partial "head.html" . }}</head>
<body id="top" class="{{ if eq .Layout "studio" }}studio-page{{ end }}">
<a class="skip-link" href="#main">跳到正文</a>
{{ partial "header.html" . }}
<main id="main" class="page-shell">{{ block "main" . }}{{ end }}</main>
{{ partial "footer.html" . }}
{{ if .Store.Get "hasMath" }}{{ partial "math.html" . }}{{ end }}
{{ if .Store.Get "hasMermaid" }}<script id="mermaid_script" data-light-theme="default" data-dark-theme="default" type="module" src="{{ "js/mermaid.js" | relURL }}"></script>{{ end }}
<script src="{{ "js/journal.js" | relURL }}" defer></script>
<script src="{{ "js/gallery-lightbox.js" | relURL }}" defer></script>
</body></html>
