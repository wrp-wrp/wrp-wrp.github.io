baseURL = 'https://wrp-wrp.github.io/'
languageCode = 'en-us'
title = "rprp's blog"
theme = 'typo'
math = true

# Set a real measurement ID here to enable analytics.
googleAnalytics = ""

[taxonomies]
tag = 'tags'

[params]
# Meta description
description = "Research notes on vector search, cloud storage, and database systems, alongside algorithms and course notes by rprp, a computer science student at HUST."
toc = true

# Appearance settings
theme = 'auto'
colorPalette = 'default'
hideHeader = false

# Intro on main page, content is markdown
