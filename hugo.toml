baseURL = 'https://wrp-wrp.github.io/'
languageCode = 'zh-CN'
hasCJKLanguage = true
title = '万睿朋 · rprp'
math = true

# Set a real measurement ID here to enable analytics.
googleAnalytics = ""

[taxonomies]
tag = 'tags'

[params]
description = "万睿朋的个人主页和技术博客，关注向量检索、对象存储与数据库系统。"
toc = true
homeAvatarPath = "images/home-avatar.jpg"
profileAuthor = "Ruipeng Wan"

# Syntax highlight on code blocks
[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
    [markup.goldmark.renderer]
      unsafe = true
    # Server-side math: goldmark passes $…$/$$…$$ through untouched so the
    # render-passthrough hook can typeset it at build time (no client-side KaTeX
    # reflow — see layouts/_default/_markup/render-passthrough.html).
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$'], ['\[', '\]']]
        inline = [['$', '$'], ['\(', '\)']]
  [markup.highlight]
    style = 'algol'

